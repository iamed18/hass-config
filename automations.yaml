      target:
        entity_id: switch.cph50_charging_session
    - device_id: 63d05374a092b14732f9e6119c0ca4f6
      domain: button
      entity_id: c00c09f3141c7e8b45bf0d6a0c0fbf7f
      type: press
    - device_id: 1283caaf4f8ae7389b359a2753b68365
      domain: button
      entity_id: 4b8713953d6423f3d0d07bbae65c9ca9
      type: press
    - delay:
