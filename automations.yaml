- id: '1755586424225'
  alias: Stop Cars Charging AM
  description: Stop charging at 7:00 AM for any car currently charging at home
  triggers:
  - trigger: time
    at: 07:00:00
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: sensor.victoria_state
      state: charging
    - condition: state
      entity_id: device_tracker.victoria_location_2
      state: home
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.victoria_charge
      continue_on_error: true
  - if:
    - condition: state
      entity_id: sensor.vendetta_state
      state: charging
    - condition: state
      entity_id: device_tracker.vendetta_location
      state: home
    then:
    - action: switch.turn_off
      metadata: {}
      data: {}
      target:
        entity_id: switch.vendetta_charge
      continue_on_error: true
  mode: single
- id: '1771382915027'
  alias: SSL Renewal
  description: Renew Let's Encrypt certificate when expiring within 21 days or invalid
  triggers:
  - trigger: time
    at: 03:00:00
  conditions:
  - condition: template
    value_template: >-
      {{ not state_attr('sensor.ha_thephysicist_us_cert_expiry', 'is_valid')
         or (as_datetime(states('sensor.ha_thephysicist_us_cert_expiry')) - now()).days < 21 }}
  actions:
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: core_letsencrypt
  - delay:
      minutes: 3
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: core_nginx_proxy
  mode: single
