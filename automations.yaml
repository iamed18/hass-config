- id: '1739339999540'
  alias: Victoria Plugin Reminder
  description: Notify Ed and Laura at 10 PM if Victoria is unplugged and below 150 miles rated range
  triggers:
  - trigger: time
    at: '22:00:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.victoria_plugged_in
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.victoria_rated_battery_range
    below: 150
  actions:
  - action: notify.mobile_app_hinton
    metadata: {}
    data:
      data:
        notification_icon: mdi:ev-plug-tesla
      message: Current range is {{ states("sensor.victoria_rated_battery_range") | round(0)
        }} miles
      title: Plug in Victoria
  - action: notify.mobile_app_pixel_11_pro
    metadata: {}
    data:
      message: Current range is {{ states("sensor.victoria_rated_battery_range") | round(0)
        }} miles
      title: Plug in Victoria
      data:
        notification_icon: mdi:ev-plug-tesla
  mode: single
