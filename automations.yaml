- id: '1750310770286'
  alias: Arrive Home Lights
  description: ''
  triggers:
  - device_id: bac1b25b137b6e5318ad74b13328e330
    domain: device_tracker
    entity_id: b9be13422641717cbf8c9296c4388072
    type: enters
    trigger: device
    zone: zone.home
  - device_id: a21dc8d8acc60b529d24e82c47808e6d
    domain: device_tracker
    entity_id: 128e78cfb16461d9dd222dfe3ae86adc
    type: enters
    trigger: device
    zone: zone.home
  conditions:
  - condition: or
    conditions:
    - condition: sun
      after: sunset
      after_offset: -00:30:00
    - condition: sun
      before: sunrise
  actions:
  - action: light.turn_on
    metadata: {}
    data:
      transition: 10
    target:
      entity_id:
      - light.kitchen_display_cabinet
      - light.kitchen_under_cabinet
      - light.standing_lamp
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.reading_lamp
  - action: light.turn_on
    metadata: {}
    data:
      brightness_pct: 20
    target:
      entity_id: light.office_spot_lights
  mode: single
