- id: '1739339999540'
  alias: Victoria Plugin Reminder
  description: ''
  triggers:
  - trigger: time
    at: '21:10:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.victoria_charge_cable
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.victoria_est_battery_range
    below: 100
  actions:
  - action: notify.mobile_app_hinton
    metadata: {}
    data:
      data:
        notification_icon: mdi:ev-plug-tesla
      message: Current range is {{ states("sensor.victoria_est_battery_range") | round(0)
        }} miles
      title: Plug in Victoria
  - action: notify.mobile_app_pixel_11_pro
    metadata: {}
    data:
      message: Current range is {{ states("sensor.victoria_est_battery_range") | round(0)
        }} miles
      title: Plug in Victoria
      data:
        notification_icon: mdi:ev-plug-tesla
  mode: single
