- id: '1771382915027'
  alias: SSL Renewal
  description: Renew Let's Encrypt certificate when expiring within 21 days or invalid
  triggers:
  - trigger: time
    at: 03:00:00
  conditions:
  - condition: template
    value_template: >-
      {{ not state_attr('sensor.ha_thephysicist_us_cert_expiry', 'is_valid')
         or (as_datetime(states('sensor.ha_thephysicist_us_cert_expiry')) - now()).days < 21 }}
  actions:
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: core_letsencrypt
  - delay:
      minutes: 3
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: core_nginx_proxy
  mode: single
