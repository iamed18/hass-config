  - sequence:
    - action: homeassistant.reload_config_entry
      metadata: {}
      data:
        entry_id: 01JKSFRV6BDX8GJBGQMWGZVK5C
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: switch.turn_on
      metadata: {}
