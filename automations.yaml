- id: '1771382915027'
  alias: SSL Renewal
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.ha_thephysicist_us_cert_expiry
    attribute: is_valid
    to:
    - 'false'
  conditions:
  - condition: state
    entity_id: sensor.ha_thephysicist_us_cert_expiry
    state: []
    attribute: is_valid
  actions:
  - action: hassio.addon_start
    metadata: {}
    data:
      addon: core_letsencrypt
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: core_nginx_proxy
  mode: single
