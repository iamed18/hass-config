sensor:
  - platform: history_stats
    name: Laura's WQ Hours
    entity_id: person.laura
    state: "Work-WQ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Laura's AJ Hours
    entity_id: person.laura
    state: "Work-AJ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Victoria's AJ Hours
    entity_id: device_tracker.victoria_location_2
    state: "Work-AJ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Victoria's WQ Hours
    entity_id: device_tracker.victoria_location_2
    state: "Work-WQ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Vendetta's WQ Hours
    entity_id: device_tracker.vendetta_location
    state: "Work-WQ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Vendetta's AJ Hours
    entity_id: device_tracker.vendetta_location
    state: "Work-AJ"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
